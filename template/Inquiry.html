<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Information Table</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f9f9f9;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      table {
        width: 70%;
        margin: 20px auto;
        border: 2px solid #4caf50;
        border-collapse: collapse;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 12px 20px;
        text-align: center;
      }
      th {
        background-color: #4caf50;
        color: white;
        font-weight: bold;
        text-transform: uppercase;
      }
      tr:nth-child(even) {
        background-color: #f2f2f2;
      }
      tr:hover {
        background-color: #d4edda;
        cursor: pointer;
      }
      td {
        color: #333;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <table>
      <tr>
        <th>Full Name</th>
        <th>Email</th>
        <th>Phone</th>
      </tr>
      {% for i in namelist %}
      <tr>
        <td>{{ i.fullName }}</td>
        <td>{{ i.emial }}</td>
        <td>{{ i.phone }}</td>
      </tr>
      {% endfor %}
    </table>
  </body>
</html>
